<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Items App</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <h1>Items</h1>

    <form id="item-form" class="form">
      <input id="name" type="text" placeholder="Item name" required />
      <input id="price" type="number" step="0.01" placeholder="Price" required />
      <button type="submit">Add item</button>
    </form>

    <p id="message"></p>

    <ul id="items-list" class="items-list"></ul>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
